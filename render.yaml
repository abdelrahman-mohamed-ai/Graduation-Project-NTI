# Free Render web-service configuration for a public demo.
# Free instances have an ephemeral filesystem; SQLite data is intentionally temporary.
services:
  - type: web
    name: eduguard-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py 'app:create_app()'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.16
      - key: EDUGUARD_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: EDUGUARD_DATABASE_PATH
        value: /tmp/eduguard.db
      - key: EDUGUARD_SEED_DATABASE
        value: "true"
