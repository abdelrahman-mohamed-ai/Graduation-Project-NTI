<div class="filters"><label class="input-icon"><i data-lucide="search"></i><input id="student-search" name="q" placeholder="Search student ID or name" aria-label="Search student ID or name"></label><select id="risk-filter" name="risk" aria-label="Filter by risk"><option value="">All risk levels</option><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option></select><select id="course-filter" name="course" aria-label="Filter by course"><option value="">All courses</option>{% for code, name in model.course_map.items() %}<option value="{{ code }}">{{ name }}</option>{% endfor %}</select>{% if page == 'students' %}<button class="button" id="more-filters" aria-expanded="false"><i data-lucide="sliders-horizontal"></i> Filters</button>{% endif %}</div>
{% if page == 'students' %}<div class="advanced-filters" id="advanced-filters" hidden><label>Manual review<select id="review-filter" name="review"><option value="">All students</option><option value="1">Recommended</option><option value="0">Not flagged</option></select></label><label>Source<select id="source-filter" name="source"><option value="">All sources</option><option value="Enrolled dataset">Enrolled dataset</option><option value="Manual entry">Manual entry</option><option value="Upload">Upload</option></select></label><label>Minimum risk (%)<input id="min-risk" name="min_risk" type="number" min="0" max="100" placeholder="0"></label><label>Maximum risk (%)<input id="max-risk" name="max_risk" type="number" min="0" max="100" placeholder="100"></label><button class="button" id="clear-filters">Clear filters</button></div>{% endif %}
